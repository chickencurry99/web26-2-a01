<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <title>이미지 불러오기</title>
</head>
<body>
    <h1> 저장된 이미지 </h1>
    <img src="./src_ch3/Penguins.jpg" alt="펭귄" width="300">
    <h1> 이미지 안 뜰시 alt로 알림 </h1>
    <img src="Nothing" alt="그림 존재하지 않음, 펭귄" width="300">
    <h1> 인터넷 이미지 </h1>
    <img src="https://seoul.intercontinental.com/resources/1786352561959-1f354ea69c1e4e7087b1fc4cf197ad6f.png" alt="로고" width="300">
    

    <h2>15audio_basic</h2>
    <audio src="./src_ch3/Kalimba.mp3" controls="controls"></audio>
    <!--웹브라우저마다 지원하는 파일 확장자가 다른 문제에선-->
    <h2>16audio_source</h2>
    <audio controls="controls">
        <source src="./src_ch3/Kalimba.mp3" type="audio/mp3">
        <source src="./src_ch3/Kalimba.ogg" type="audio/ogg">
    </audio>

    <h2>17video_basic</h2>
    <video controls="controls">
        <source src="./src_ch3/Wildlife.mp4" type="video/mp4">
        <source src="./src_ch3/Wildlife.webm" type="video/webm">
    </video>

    <h2>18video_poster</h2>
    <video controls="controls" poster="./src_ch3/Horse.jpeg">
        <source src="./src_ch3/Wildlife.mp4" type="video/mp4">
        <source src="./src_ch3/Wildlife.webm" type="video/webm">
    </video>
</body>
</html>
