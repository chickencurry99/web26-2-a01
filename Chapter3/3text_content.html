<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <title>제목과  본문 태그의 활용</title>

    <style>
        
        body {
            background-color: #F1F7E8;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        h1{
            color : #146B3A;
        }
        h2{
            color:rgb(81, 158, 110);
        }
        hr{
            border: 0;
            border-top: 2px dotted #B7CC9A;
            margin: 40px;
        }
        p{
            color :#616e63;
        }
    </style>
</head>
<body>
    <br>
    <br>
    <h1>🍵 홍차 🍵</h1>
    <br>
    <br>
    <hr>
    <br>
    <h2>🍵 정의</h2>
    <p>홍차는 차나무의 잎을 발효시켜 만든 차이다. </p>
    <!--hr을 텍스트 중간에 넣으면 잘라짐 줄바꿈이 되지만 한 문장마다 선쳐짐/br은 걍 엔터임-->
    <br>
    <h2>🍵 등급</h2>
    <p>홍차는 여러가지로 등급이 매겨진다. <br>일반적으로 찻잎의 모양에 따른 등급과 가공 상태에 따른 등급을 조합하여</p>
    <p> -브로큰 페코</p>
    <p> -브로큰 페코 수숑</p>
    <p> -브로큰 오렌지 페코</p>
    <br>



    <hr>
    <br>
    <h1>[특수 문자 표기 실습]</h1>
    <!--<h2>공백이   있는 글자.</h2>-->
    <h2>공백이 &nbsp;&nbsp;&nbsp;있는 글자.</h2>
    <!--3칸 띄어 쓰기-->

    <!-- <h2>(숫자1) > (숫자2) </h2>. -> 특수 기호 쓸 때-->
    <p>3>2<p>
    <!--이런거 보다-->
    <p>5 &lt; 9</p>
    <p>3 &gt; 2</p>
    <p>3 &amp; 2</p>
    <br>
    <br>
    <br>

</body>
</html>
