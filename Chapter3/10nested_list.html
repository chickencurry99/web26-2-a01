<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
   
    <title>10중첩 목록 만들기</title>

    <style>
        
        body {
            background-color: #F1F7E8;
            font-family: Arial, sans-serif;
            color : rgb(31, 84, 84);
        }
        h1{
            color:#39A852;
        }
        h3{
            color:rgb(47, 107, 64);
        }

        
    </style>
</head>
<body>
    <br>
    <br>
    <br>
    <h1> 8. 순서가 없는 기본 목록 </h1>
    <ul>
        <li>사과</li>
        <li>바나나</li>
        <li>오렌지</li>
    </ul>
    <br>
    <br>
    <br>
    <h1> 9. 순서가 있는 기본 목록 </h1>
    <ol>
        <li>사과</li>
        <li>바나나</li>
        <li>오렌지</li>
    </ol>
    <br>
    <br>
    <br>
    <h1> 10. 중첩 목록 </h1>
    <ul>
        <!--첫번째 목룩-->
        <li>
            <h3>과일</h3>
            <ol>
                <li>사과</li>
                <li>바나나</li>
                <li>오렌지</li>
            </ol>
        </li>
        <br>
        <!--두번째 목룩-->
        <li>
            <h3>채소</h3>
            <ol>
                <li>상추</li>
                <li>치커리</li>
                <li>양배추</li>
            </ol>
        </li>
    </ul>
</body>
</html>
