<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <title>1.박스 속성</title>

    <Style>
         body {
            background-color: #E5DFD1;
            text-align: center;
            font-family: '맑은 고딕', 돋움, sans-serif;
        }
        *{color:#62645D;}

        .box{
            border-width: thick;
            border-style:dashed;
            border-color:#315E91;
        }

        .box2{
            border-width: thick;
            border-style:dashed;
            border-color:#315E91;
            border-radius:20px;
        }

        .box3{
            border-width: thick;
            border-style:dashed;
            border-color:#315E91;
            /*왼쪽 위, 오른쪽 위, 오른쪽 아래, 왼쪽 아래 각각 모서리 각도*/
            border-radius:50px 40px 20px 10px;
        }


    </Style>
    
</head>

<body>
    <br>
    <h2>2. 박스 테두리</h2>
    
    <div class="box">
        <h1>Loream ipsum dolor sit amet</h1>
    </div>

    <br>
    <br>
    <br>

    <div class="box2">
        <h1>Loream ipsum dolor sit amet</h1>
    </div>

    <br>
    <br>
    <br>

    <div class="box3">
        <h1>Loream ipsum dolor sit amet</h1>
    </div>
</body>

</html>
