<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <title>1.박스 속성</title>

    <style>

        body {
            background-color: #E5DFD1;
            text-align: center;
            font-family: '맑은 고딕', 돋움, sans-serif;
        }
        *{color:#62645D;}

        #d6_1{
            width : 100px; height : 100px;
            background-color: #A65D57;
            /*가운데 도형 배치하기 위한*/
            margin: 0 auto;
        }
            /*6-2*/
        #d6_2{
            width : 100px; height : 100px;
            background-color: #A65D57;
            border : 20px solid #daa794;
            margin : 10px; padding : 30px;

            margin: 0 auto;
        }

            /* margin : 위 오 아 왼
               padding : 위 오 아 왼 */
            /*6-3*/
        #d6_3{
            width : 100px; height : 100px;
            background-color: #A65D57;
            margin : 0 30px 0 30px;
            padding : 0 30px 0 30px;

            margin: 0 auto;
        }

            /*6-4*/
            /*margin : <위아래> <왼쪽오른쪽>
            paddingn : <위아래> <왼쪽오른쪽>*/
        #d6_4{
            width : 100px; height : 100px;
            background-color: #A65D57;
            margin : 0 30px;
            padding : 0 30px;

            margin: 0 auto;
        }

        h2{
            color :#722F37;
        }

        
    </style>

</head>

<body>
    <br>
    <h2>CSS Property Basic</h2>
    <h2>2. 박스 테두리</h2>    
    [ 6-1 ]
    <div id="d6_1"></div>
    <br>
    [ 6-2 ]
    <div id="d6_2"></div>
    <br>
    [ 6-3 ]
    <div id="d6_3"></div>
    <br>
    [ 6-4 ]
    <div id="d6_4"></div>
    
    
</body>

</html>
