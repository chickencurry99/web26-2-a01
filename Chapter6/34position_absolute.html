<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">    
    <title>5. 위치 속성</title>

    <style>
        .box{
            width: 100px;
            height: 100px;
            position: absolute;
        }
        /* left속성과 top속성을 적용 */
        /* z-index는 큰 값이 앞으로 나온다 작은 값이면 뒤로 나온다 */
        .box:nth-child(1){background-color: red;}
        .box:nth-child(2){background-color: green;}
        .box:nth-child(3){background-color: blue;}
    </style>
    
</head>
<body>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <!--얘네를 올려야body 하위로 n번째로 셈 요소를-->
    <h2>6.5.1 요소의 고정 위치 설정(예제6-34)</h2>
    <h3> 1. position속성</h3>    
    <h4>. position: absolute; - 요소를 절대 위치로 이동</h4>
    <h4>. position: fixed; - 화면을 기준으로 절대 위치 좌표 설정</h4>
    <h4>. position: relative; - 요소를 상대 위치로 이동</h4>
    <h4>. position: static; - 요소를 정적 위치로 이동</h4>
    <h3> 2. left속성과 top속성 적용하기(예제6-35)</h3>
    <h3> 3. z-index속성 적용하기(예제6-36)</h3>

    <hr>
    


</body>
</html>
